name: Update forecast and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run after the China A-share close and after the feed has had time to
    # publish the completed session (22:30 Beijing / 14:30 UTC).
    - cron: "30 14 * * 1-5"
    - cron: "30 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # A source-only push publishes the updated UI immediately without pretending
  # that a new next-session forecast exists during the trading session.
  source_only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload source UI artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy source UI
        id: source_deployment
        uses: actions/deploy-pages@v4

  # Manual runs are common while debugging.  Before the close, the latest
  # source row is still today's session, so the forecast window is intentionally
  # rejected by the quality gate.  Defer those runs instead of turning them
  # into noisy failed-workflow emails.
  preflight:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.gate.outputs.should_update }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check China market update window
        id: gate
        shell: bash
        run: |
          read -r weekday hhmm <<< "$(TZ=Asia/Shanghai date '+%u %H%M')"
          should_update=false
          reason="等待收盘数据稳定后再更新"
          if [[ "$weekday" -ge 1 && "$weekday" -le 5 && "$hhmm" -ge "2200" ]]; then
            should_update=true
            reason="工作日收盘后更新窗口"
          elif [[ "$weekday" == "7" && "$hhmm" -ge "2030" ]]; then
            should_update=true
            reason="周日盘前更新窗口"
          elif [[ "$weekday" == "6" ]]; then
            reason="周六不运行市场更新"
          fi
          echo "should_update=$should_update" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "China time: weekday=$weekday hhmm=$hhmm; should_update=$should_update; reason=$reason"

  update:
    needs: preflight
    if: github.event_name != 'push' && needs.preflight.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore market-data cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-

      - name: Install forecast dependencies
        run: python -m pip install --requirement requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch, retrain, and validate
        run: python automation.py --max-data-age-days 5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Preserve the accepted forecast in Git
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "a-share-forecast-bot"
          git config user.email "a-share-forecast-bot@users.noreply.github.com"
          git add public/data/forecast.json data/performance_history.json \
            data/sse_holidays.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update accepted forecast"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forecast-diagnostics-${{ github.run_id }}
          path: |
            data/automation/last_run.json
            data/automation/automation.log
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published forecast
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          url = os.environ["PAGE_URL"].rstrip("/") + "/data/forecast.json"
          last_error = None
          for _ in range(10):
              try:
                  with urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  assert payload["meta"]["release"] == "17"
                  assert payload["meta"]["automation"]["status"] == "passed"
                  assert payload["meta"]["trading_calendar"]["name"] == "XSHG"
                  assert payload["meta"]["trading_calendar"]["verified_through"]
                  assert payload["performance_monitor"]["status"] in {
                      "collecting", "healthy", "watch", "degraded"
                  }
                  assert payload["performance_monitor"]["effective_sample"] == (
                      "第1日预测的唯一目标交易日"
                  )
                  assert payload["day_ahead"]["horizon"] == "next_trading_session"
                  assert payload["day_ahead"]["based_on_close_date"] == (
                      payload["meta"]["data_through"]
                  )
                  assert payload["validation"]["calibration"]
                  assert len(payload["days"]) == 5
                  assert len(payload["sector_forecast"]["sectors"]) >= 10
                  assert all(
                      len(sector["history"]) >= 50
                      for sector in payload["sector_forecast"]["sectors"]
                  )
                  print("Published forecast verified:", url)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(6)
          else:
              raise SystemExit(f"Published forecast verification failed: {last_error}")
          PY
