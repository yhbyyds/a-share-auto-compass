name: Collect intraday research snapshots

on:
  # UTC schedule; GitHub Actions is a fallback collector. The Windows task is
  # preferred for precise fixed-time observations because hosted cron can lag.
  schedule:
    - cron: "35 1 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collection dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Collect one fixed-time snapshot
        run: python intraday_update.py
      - name: Preserve training observations
        run: |
          git config user.name "a-share-forecast-bot"
          git config user.email "a-share-forecast-bot@users.noreply.github.com"
          git add data/intraday/snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: collect intraday research snapshot"
            git push
          fi
